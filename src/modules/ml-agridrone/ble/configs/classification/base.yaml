# Classifieur de maladies du blé (chantier 4) : réglages communs aux architectures.
# Lancement : uv run agridrone train -c ble/configs/classification/efficientnet_b0.yaml
# Données   : uv run agridrone data prepare-classification (voir ble/reports/data_pipeline.md)
_base_: ../base.yaml
task: classification

data:
  dir: data/ble/processed/classification
  # L'ordre fixe l'ordre des sorties du modèle.
  classes: [healthy, yellow_rust, brown_rust, septoria, powdery_mildew]
  healthy_class: healthy
  display_names:
    healthy: sain
    yellow_rust: rouille jaune
    brown_rust: rouille brune
    septoria: septoriose
    powdery_mildew: oïdium
  train_split: train            # John Innes (Royaume-Uni)
  val_split: val                # John Innes : choix du modèle + calibration des seuils
  test_splits:
    - test                          # John Innes, test intra-source
    - test_ethiopia_wheat_leaf      # Éthiopie : sain, rouille jaune, septoriose
    - test_kaggle_yellowrust_2223   # Kaggle (candidate) : sain, rouille jaune
  split_names:
    val: John Innes (validation)
    test: John Innes (test)
    test_ethiopia_wheat_leaf: Éthiopie
    test_kaggle_yellowrust_2223: YellowRust 22-23

model:
  input_size: 224               # résolution des poids pré-entraînés
  pretrained: true

train:
  epochs: 25
  batch_size: 32
  warmup_epochs: 1
  min_lr_ratio: 0.01
  class_weights: balanced       # chaque classe pèse autant dans la perte
  # Pas de lissage des étiquettes : il brouille la confiance qui sert au seuil « incertain ».
  label_smoothing: 0.0
  patience: 8                   # époques sans progrès du F1 macro de validation
  precision: fp32

eval:
  batch_size: 64
  precision: fp32
  target_coverage: 0.90         # 90 % des images de validation reçoivent une décision
  max_missed_rate: 0.02         # au plus 2 % d'images malades déclarées saines (validation)
