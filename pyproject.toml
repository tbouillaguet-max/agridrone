[project]
name = "agridrone"
version = "0.1.0"
description = "Briques ML d'un drone agricole : pucerons et maladies du blé (RVB), cartes de stress (multispectral N bandes)."
readme = "README.md"
# rasterio >= 1.5 et numpy >= 2.5 exigent Python >= 3.12. Le runtime embarqué
# (Jetson, chantier 6) n'utilisera que les modèles exportés en ONNX, pas cette pile.
requires-python = ">=3.12"
dependencies = [
    # --- Deep learning ---
    "torch>=2.4",
    "torchvision>=0.19",
    "timm>=1.0",
    "segmentation-models-pytorch>=0.5",
    # AGPL-3.0 : usage commercial fermé => licence Enterprise Ultralytics (voir README).
    "ultralytics>=8.3.40",
    # --- Données / images ---
    # 2.0.8 = dernière version MIT ; la suite (albumentationsx) est AGPL-3.0.
    "albumentations==2.0.8",
    "opencv-python-headless>=4.10,<5",
    "rasterio>=1.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "matplotlib>=3.8",
    "tqdm>=4.66",
    "requests>=2.31",
    # --- Configs / suivi d'expériences ---
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "mlflow>=3.0",
]

[project.scripts]
agridrone = "agridrone.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
]
notebooks = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agridrone"]

[tool.uv]
required-version = ">=0.9"
default-groups = ["dev"]
# ultralytics et sahi tirent opencv-python (build GUI) alors qu'albumentations tire
# opencv-python-headless : les deux installent le même module `cv2` et se
# marchent dessus. On ne garde que la version headless.
exclude-dependencies = ["opencv-python"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "NPY", "RUF"]
# RUF001-003 : caractères ambigus — faux positifs sur les docstrings en français.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Les tests vérifient justement le RNG global legacy de NumPy.
"tests/*" = ["NPY002"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
strict = true
warn_unreachable = true
# Une bonne partie de l'API PyTorch n'est pas annotée.
disallow_untyped_calls = false
# Bibliothèques sans annotations de type.
[[tool.mypy.overrides]]
module = [
    "ultralytics.*",
    "segmentation_models_pytorch.*",
    "timm.*",
    "rasterio.*",
    "mlflow.*",
    "albumentations.*",
    "torchvision.*",
    "tqdm.*",
    "pandas.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "slow: tests lents (MLflow, entraînement court)",
]
filterwarnings = [
    "ignore::DeprecationWarning:mlflow.*",
]
