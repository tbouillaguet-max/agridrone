# Modèle binaire « sain fiable » : ConvNeXt-Tiny, sain / malade (toute maladie).
# Objectif : quand il dit « sain », il doit avoir raison. Tout le reste est « malade ».
# Données : uv run agridrone data prepare-classification \
#             --data-config configs/data/classification_binaire.yaml
# Lancement : uv run agridrone train -c configs/classification/binaire_convnext_tiny.yaml
_base_: ../base.yaml
task: classification
name: binaire_convnext_tiny

data:
  dir: data/processed/classification_binaire
  classes: [healthy, diseased]
  healthy_class: healthy
  display_names: {healthy: sain, diseased: malade}
  train_split: train
  val_split: val
  test_splits:
    - test                            # John Innes + Henan, test interne
    - test_ethiopia_wheat_leaf        # jamais vus à l'entraînement
    - test_kaggle_yellowrust_2223
    - test_tekirdag_powdery_mildew
    - test_bangladesh_wheat_disease   # 4 maladies absentes de l'entraînement
  split_names:
    val: John Innes + Henan (validation)
    test: John Innes + Henan (test)
    test_ethiopia_wheat_leaf: Éthiopie
    test_kaggle_yellowrust_2223: YellowRust 22-23
    test_tekirdag_powdery_mildew: Tekirdağ (Turquie)
    test_bangladesh_wheat_disease: Bangladesh (maladies jamais vues)

model:
  arch: convnext_tiny.fb_in22k_ft_in1k   # poids Apache-2.0
  pretrained: true
  input_size: 224
  drop_rate: 0.0
  drop_path_rate: 0.1

train:
  epochs: 8                     # 5 fois plus d'images par époque que le modèle à 5 classes
  batch_size: 32
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_epochs: 1
  min_lr_ratio: 0.01
  class_weights: balanced
  label_smoothing: 0.0
  patience: 3
  # bf16 : CPU avec AMX ou GPU Ampere et plus récent. Sur un CPU sans AMX ni AVX512-BF16,
  # le bf16 est émulé et 3 fois plus lent : lancer avec train.precision=fp32.
  precision: bf16

eval:
  batch_size: 64
  precision: fp32
  # Pas de sortie « incertain » : une image est « saine » seulement si p(sain) dépasse
  # le seuil, sinon « malade ». Le seuil est le plus bas qui garde au plus 1 % d'images
  # malades déclarées saines sur la validation.
  target_coverage: 1.0
  max_missed_rate: 0.01
