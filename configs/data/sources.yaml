# Registre des sources de données (chantier 2).
#
# Projet académique, non commercial (confirmé le 2026-10-12) : toute source
# téléchargeable est récupérée par défaut (`uv run agridrone data download`), quelle
# que soit sa licence, pour que chaque expérience se reproduise sans option.
#
# Chaque source indique son projet (wheat : blé, olive : olivier), sa licence, la
# preuve de vérification et l'attribution à reproduire. Le statut décrit la licence ;
# il ne bloque ni le téléchargement ni l'entraînement :
#   retained      : licence permissive (CC BY, CC0, MIT...), provenance établie ;
#   candidate     : licence permissive déclarée, provenance à confirmer ;
#   noncommercial : licence non commerciale ou inconnue (usage académique) ;
#   manual        : pas de téléchargement automatique (formulaire, compte, accord,
#                   dépôt qui refuse les accès automatisés) : à faire à la main ;
#   excluded      : re-publication ou compilation d'autres jeux, jamais téléchargée.
# Liste lisible par tous : LICENCES_DONNEES.txt, régénérée par
# `uv run agridrone data licences`.
#
# Sommes de contrôle : celles publiées par le fournisseur (Zenodo, Dataverse : md5 ;
# Mendeley : sha256) sont recopiées ici. Pour Kaggle, GFZ et S3, qui n'en publient
# pas, le premier téléchargement enregistre le sha256 dans sources.lock.yaml ;
# les suivants sont vérifiés contre lui.

