# Registre des sources de données (chantier 2).
#
# Chaque source indique sa licence, la preuve de vérification et l'attribution
# à reproduire. Statuts :
#   retained  : licence compatible avec un usage commercial, provenance établie ;
#   candidate : licence permissive déclarée, provenance à confirmer (téléchargée
#               seulement avec --include-candidates) ;
#   excluded  : jamais téléchargée (gardée ici pour tracer la décision).
# Le schéma refuse un statut `retained` avec une licence hors de la liste
# autorisée (agridrone.data.sources.COMMERCIAL_LICENSES).
#
# Sommes de contrôle : celles publiées par le fournisseur (Zenodo : md5,
# Mendeley : sha256) sont recopiées ici. Pour Kaggle et GFZ, qui n'en publient
# pas, le premier téléchargement enregistre le sha256 dans sources.lock.yaml ;
# les suivants sont vérifiés contre lui.

sources:
