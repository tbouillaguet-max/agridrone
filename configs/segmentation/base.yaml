# Segmentation multispectrale (chantier 5) : réglages communs.
# Lancement : uv run agridrone train -c configs/segmentation/unet_5bandes.yaml
# Données   : uv run agridrone data prepare-segmentation (voir reports/data_pipeline.md)
#
# Aucun jeu public ouvert ne couvre les maladies du blé en multispectral drone
# (inventaire, § 7.2) : la chaîne N bandes est validée sur WeedsGalore (maïs, DJI P4
# Multispectral, fond / culture / adventice, découpage officiel spatial).
_base_: ../base.yaml
task: segmentation

data:
  dir: data/processed/segmentation/weedsgalore
  bands: []                     # vide : toutes les bandes du jeu (B, V, R, RE, PIR)
  background_class: background
  display_names: {background: fond, crop: culture, weed: adventice}
  class_colors: ["#d8d2c4", "#1baf7a", "#eb6834"]   # fond neutre ; culture / adventice validées (daltonisme)
  stats_file: band_stats_train.json  # moyenne / écart-type par bande, ensemble d'entraînement
  train_split: train
  val_split: val
  test_splits: [test]

model:
  encoder: tu-resnet18.a1_in1k  # poids timm ImageNet-1k, licence Apache-2.0
  pretrained: true

train:
  epochs: 40
  batch_size: 8
  lr: 5.0e-4
  weight_decay: 1.0e-4
  warmup_epochs: 1
  crop: 256                     # recadrages aléatoires (multiple de 32)
  samples_per_image: 4          # 104 images × 4 = 416 recadrages par époque
  loss: ce_dice
  patience: 10                  # époques sans progrès du mIoU de validation
  # bf16 : entraînement 2,3 fois plus rapide sur un CPU avec AMX (mesuré : 12,6 contre
  # 5,4 recadrages/s) ; sur un CPU sans AMX ni AVX512-BF16, repasser en fp32.
  precision: bf16

eval:
  tile: 256                     # inférence par tuiles, comme sur une orthomosaïque
  overlap: 64
  batch_size: 8
  precision: fp32
  baselines: [ndvi, ndre]       # Otsu, multi-Otsu et seuil supervisé, sur l'entraînement
  examples: 4
